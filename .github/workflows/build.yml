name: Build

# Branches = channels (tools/version.sh, docs/updates.md):
# - testing: every push (merge) is built, tested and published
#   (26.12-testing.7);
# - stable: every push (merge of a pull request) is published as the next
#   YY.MM.S by stable.yml, which calls this workflow with that version and
#   the commit to build.
# Pull requests build and test, but never publish anything. Pull requests to
# stable run every test (no targeting), plus two more: the update from the
# stable version published today to this build (Test stable-update), and
# every optional extension of xeeonos-extensions (stable branch) built and
# tried on this build (Test optional extensions). The publishing of stable
# runs them too: a version whose extensions do not build is not published.
on:
  push:
    branches: [testing]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Stable version to build and publish (YY.MM.S, from stable.yml)
        type: string
        required: true
      ref:
        description: Commit to build
        type: string
        required: true

# The stable version, when called by stable.yml (tools/version.sh reads it).
env:
  XEEONOS_VERSION: ${{ inputs.version }}

# A new push to a pull request replaces its running checks.
# A stable publish (stable.yml) has its own group and is never cancelled.
concurrency:
  group: build-${{ github.ref }}${{ inputs.version && format('-{0}', inputs.version) || '' }}
  cancel-in-progress: ${{ !inputs.version }}

#   xctl -> build -> test (one job per feature, in parallel) -> publish
#
# Every run builds and tests everything. Everything is built once, in
# `build`; each test job starts from a clean copy of what it built (artifacts,
# kept 3 days), so the test jobs are independent: one failure does not stop
# the others, and "Re-run failed jobs" repeats only the failed ones, without
# building again. Downloaded packages are cached (see `build`).
#
# One exception, for pull requests only: when the previous run of the same
# pull request failed and nothing that goes into the images changed since
# (same tools/image-key.sh fingerprint: only tests or docs changed), `build`
# reuses that run's images instead of building them again, and the tests run
# on them. Channel branches always build.
# The tests are in tools/ci/ (one script per job, see tools/ci/README.md).
jobs:
  xctl:
    name: xctl (format, lint, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build system, next version and live image
    needs: xctl
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.images.outputs.version }}
      run: ${{ steps.images.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The version, and the run whose artifacts the tests use: this one, or
      # (pull requests) the previous failed or cancelled run when the images
      # would be the same. image-key.txt records "<fingerprint> <version> <run>" for the
      # next run to compare.
      - name: Build, or reuse the images of the last failed or cancelled run
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key=$(tools/image-key.sh)
          version=$(tools/version.sh)
          run=$GITHUB_RUN_ID
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # The newest finished run of this pull request that did not pass,
            # failed or cancelled (a push cancels the run it replaces), and
            # whose images were built: its image-key artifact says which.
            prev=""
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=$GITHUB_HEAD_REF&event=pull_request&status=completed&per_page=10" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"failure\" or .conclusion == \"cancelled\") | .id"); do
              if gh run download "$id" --name image-key --dir "$RUNNER_TEMP/prev" 2>/dev/null; then
                prev=$id
                break
              fi
            done
            if [[ -n $prev ]]; then
              read -r prev_key prev_version prev_run < "$RUNNER_TEMP/prev/image-key.txt"
              # Its images must still be there (artifacts are kept 3 days).
              have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prev_run/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired | not) | .name | select(. == "disk-image" or . == "update-system" or . == "update-next" or . == "live")] | length')
              if [[ $prev_key == "$key" && $have == 4 ]]; then
                version=$prev_version
                run=$prev_run
                echo "REUSE=yes" >> "$GITHUB_ENV"
                echo "Images reused from run $prev_run (XeeonOS $version): nothing that goes into them changed since run $prev." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          mkdir -p out/image-key
          echo "$key $version $run" > out/image-key/image-key.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install mkosi
        if: env.REUSE != 'yes'
        uses: systemd/mkosi@ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b # v27.1

      - name: Free disk space (three images are built)
        if: env.REUSE != 'yes'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends zstd sbsigntool erofs-utils
          df -h /

      # Downloaded packages are kept between runs. They come from the dated
      # Arch snapshot in mkosi.conf, so the same snapshot always gives the
      # same files: the cache saves the downloads, never changes the result.
      # A new snapshot date starts a new cache.
      - name: Find the Arch snapshot
        if: env.REUSE != 'yes'
        run: echo "SNAPSHOT=$(sed -n 's/^Snapshot=//p' mkosi.conf | tr / -)" >> "$GITHUB_ENV"
      - name: Package cache
        if: env.REUSE != 'yes'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi.pkgcache
          key: arch-packages-${{ env.SNAPSHOT }}-${{ hashFiles('mkosi.conf', 'mkosi.conf.d/**/*.conf', 'mkosi.profiles/**/*.conf', 'mkosi.initrd.conf/**/*.conf', 'extensions/**/*.conf') }}
          restore-keys: arch-packages-${{ env.SNAPSHOT }}-

      - name: Compute version
        if: env.REUSE != 'yes'
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          # The "next" version, built only to test updating to it.
          echo "NEXT=$(tools/version.sh).1" >> "$GITHUB_ENV"

      # UEFI Secure Boot (docs/secure-boot.md): pull requests are signed with
      # a throwaway key made for this run; channel builds with the XeeonOS
      # key (secret XEEONOS_SECUREBOOT_KEY, never given to pull requests).
      - name: Secure Boot signing key
        if: env.REUSE != 'yes'
        env:
          XEEONOS_SECUREBOOT_KEY: ${{ github.event_name != 'pull_request' && secrets.XEEONOS_SECUREBOOT_KEY || '' }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            tools/secureboot.sh --test "$RUNNER_TEMP/secureboot"
          else
            tools/secureboot.sh "$RUNNER_TEMP/secureboot"
          fi
          echo "SECUREBOOT=$(tr '\n' ' ' < "$RUNNER_TEMP/secureboot/mkosi-args")" >> "$GITHUB_ENV"

      # The system extensions (extensions/, docs/extensions.md), before the
      # system: the included ones (flatpak, printing, scanner) go inside its image, the
      # optional ones (.xext) next to its update files. They hold only what
      # the system does not have, so the list of the system's packages comes
      # first: a build of the same system that only keeps that list.
      - name: Build the system extensions
        if: env.REUSE != 'yes'
        run: |
          mkdir -p mkosi.cache mkosi.pkgcache out/update-system
          mkosi --force --profile=gnome,audio --format=tar --bootable=no --image-version="$VERSION" build
          mv "mkosi.output/xeeonos_$VERSION.pkgdb.tar" "$RUNNER_TEMP/pkgdb.tar"
          # Published with the update: the extensions' repository builds them
          # for this version from its package list and Arch snapshot.
          zstd -q -T0 "$RUNNER_TEMP/pkgdb.tar" -o "out/update-system/xeeonos_$VERSION.pkgdb.tar.zst"
          printf 'VERSION=%s\nSNAPSHOT=%s\n' "$VERSION" "$(sed -n 's/^Snapshot=//p' mkosi.conf)" \
            > "out/update-system/xeeonos_$VERSION.build.txt"
          rm -rf mkosi.output
          MKEXT_WORK=$RUNNER_TEMP/mkext tools/mkext.sh "$RUNNER_TEMP/pkgdb.tar" "$VERSION" out/extensions out/update-system
          ls -lh out/extensions out/update-system

      # The system: the full disk image (first-boot tests) and its update
      # files (installed by the ISO, published on channel branches).
      - name: Build the system
        if: env.REUSE != 'yes'
        run: |
          mkdir -p out/disk-image
          mkosi $SECUREBOOT --force --profile=gnome,audio --extra-tree=out/extensions:/usr/lib/xeeonos/extensions --image-version="$VERSION" build
          ls -lhs mkosi.output/
          zstd -T0 --quiet "mkosi.output/xeeonos_$VERSION.raw" -o "out/disk-image/xeeonos_$VERSION.raw.zst"
          tools/mkupdate.sh mkosi.output "$VERSION" out/update-system
          rm -rf mkosi.output

      - name: Build the next version (for the update test)
        if: env.REUSE != 'yes'
        run: |
          mkosi $SECUREBOOT --force --profile=gnome,audio --extra-tree=out/extensions:/usr/lib/xeeonos/extensions --image-version="$NEXT" build
          tools/mkupdate.sh mkosi.output "$NEXT" out/update-next
          rm -rf mkosi.output

      - name: Build the live image (UKI)
        if: env.REUSE != 'yes'
        run: |
          mkosi $SECUREBOOT --force --profile=live --image-version="$VERSION" build
          mkdir -p out/live
          mv "mkosi.output/xeeonos_$VERSION.efi" out/live/
          rm -rf mkosi.output
          ls -lhR out/

      - name: Upload the disk image
        if: env.REUSE != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-image
          path: out/disk-image/
          retention-days: 3
          compression-level: 0

      - name: Upload the system update files
        if: env.REUSE != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-system
          path: out/update-system/
          retention-days: 3
          compression-level: 0

      - name: Upload the next version's update files
        if: env.REUSE != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-next
          path: out/update-next/
          retention-days: 3
          compression-level: 0

      - name: Upload the live image
        if: env.REUSE != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live
          path: out/live/
          retention-days: 3

      - name: Upload the image fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-key
          path: out/image-key/
          retention-days: 3

  test:
    name: Test ${{ matrix.test }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: update, artifacts: '{disk-image,update-next}'}
          - {test: setup, artifacts: disk-image}
          - {test: recovery, artifacts: disk-image}
          - {test: network, artifacts: disk-image}
          - {test: encryption, artifacts: disk-image}
          - {test: base, artifacts: disk-image}
          - {test: snapshots, artifacts: disk-image}
          - {test: hibernate, artifacts: disk-image}
          - {test: desktop, artifacts: disk-image}
          - {test: tools, artifacts: disk-image}
          - {test: flatpak, artifacts: disk-image}
          - {test: printing, artifacts: disk-image}
          - {test: scanner, artifacts: disk-image}
          - {test: extensions, artifacts: '{disk-image,update-system}'}
          - {test: extension-relations, artifacts: '{disk-image,update-system}'}
          - {test: secureboot, artifacts: '{disk-image,update-next}'}
          - {test: iso-install, artifacts: '{live,update-system}'}
          - {test: iso-alongside, artifacts: '{live,update-system}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Targeted tests: on a pull request, a test whose files
      # (tools/ci/affects.txt) did not change finishes green at once.
      # Channel branches, and pull requests to stable, always run every test.
      - name: Is this test touched by the pull request?
        if: github.event_name == 'pull_request' && github.base_ref != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          if ! tools/ci/affected.sh "${{ matrix.test }}" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "SKIP=yes" >> "$GITHUB_ENV"
          fi

      - name: Install VM and ISO tools
        if: env.SKIP != 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            qemu-system-x86 ovmf swtpm zstd dosfstools mtools xorriso fdisk

      # The runners have KVM, but /dev/kvm is not open to the runner's user:
      # without it QEMU emulates the processor (tools/boot-test.sh falls back
      # to accel=tcg), many times slower.
      - name: Let QEMU use KVM
        if: env.SKIP != 'yes'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-xeeonos-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The version of the images (they may come from an earlier run).
      - name: Version under test
        if: env.SKIP != 'yes'
        run: |
          echo "VERSION=${{ needs.build.outputs.version }}" >> "$GITHUB_ENV"
          echo "NEXT=${{ needs.build.outputs.version }}.1" >> "$GITHUB_ENV"

      - name: Download what the build made
        if: env.SKIP != 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.artifacts }}
          path: build
          run-id: ${{ needs.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: Run tools/ci/${{ matrix.test }}.sh
        if: env.SKIP != 'yes'
        run: tools/ci/${{ matrix.test }}.sh

      # The full ISO (system included, works offline) stays here; the
      # network ISO (live only, downloads the system) also goes on GitHub
      # Releases (publish job).
      - name: Upload ISO
        if: success() && matrix.test == 'iso-install' && env.SKIP != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xeeonos-iso
          path: out/xeeonos-${{ env.VERSION }}.iso
          retention-days: 14
          compression-level: 0

      - name: Upload network ISO
        if: success() && matrix.test == 'iso-install' && env.SKIP != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xeeonos-iso-net
          path: out/xeeonos-${{ env.VERSION }}-net.iso
          retention-days: 14
          compression-level: 0

      - name: Upload boot logs
        if: always() && env.SKIP != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-logs-${{ matrix.test }}
          path: out/serial-*.log
          if-no-files-found: ignore

  # From the stable version published today to this build: pull requests to
  # stable and the publishing of stable (tools/ci/stable-update.sh).
  stable-update:
    name: Test stable-update
    needs: build
    if: github.base_ref == 'stable' || inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: The tools of xeeonos-extensions (mkdisk.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/xeeonos-extensions
          ref: stable
          path: xeeonos-extensions
          persist-credentials: false
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            qemu-system-x86 ovmf zstd dosfstools mtools fdisk jq
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-xeeonos-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the update files of this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-system
          path: build/update-system
          run-id: ${{ needs.build.outputs.run }}
          github-token: ${{ github.token }}
      - name: Run tools/ci/stable-update.sh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXTENSIONS_TOOLS: ${{ github.workspace }}/xeeonos-extensions/tools
        run: tools/ci/stable-update.sh
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-logs-stable-update
          path: out/serial-*.log
          if-no-files-found: ignore

  # Every optional extension of xeeonos-extensions (its stable branch), built
  # for this build from its package list and tried on it in a virtual
  # machine, as that repository's own CI does (tools/ of xeeonos-extensions;
  # boot-test.sh of this commit): pull requests to stable and the publishing
  # of stable. A version whose extensions do not build is not published; the
  # extensions themselves are published right after, by xeeonos-extensions.
  extensions-plan:
    name: Optional extensions to try
    if: github.base_ref == 'stable' || inputs.version != ''
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/xeeonos-extensions
          ref: stable
          persist-credentials: false
      - id: names
        run: |
          names=$(for c in extensions/*/extension.conf; do basename "$(dirname "$c")"; done |
            jq -R . | jq -sc .)
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Optional extensions (xeeonos-extensions, stable): $names" >> "$GITHUB_STEP_SUMMARY"

  extension:
    name: Extension ${{ matrix.name }}
    needs: [build, extensions-plan]
    if: needs.extensions-plan.outputs.names != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.extensions-plan.outputs.names) }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: xeeonos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/xeeonos-extensions
          ref: stable
          path: xeeonos-extensions
          persist-credentials: false

      - name: Tools and disk space (rocm-sdk is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            zstd erofs-utils jq qemu-system-x86 ovmf dosfstools mtools fdisk
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"

      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-xeeonos-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the update files of this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-system
          path: ${{ env.WORK }}/system
          run-id: ${{ needs.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: The package list and the Arch snapshot of this build
        run: |
          zstd -d -q "$WORK/system/xeeonos_$VERSION.pkgdb.tar.zst" -o "$WORK/pkgdb.tar"
          echo "SNAPSHOT=$(sed -n 's/^SNAPSHOT=//p' "$WORK/system/xeeonos_$VERSION.build.txt")" >> "$GITHUB_ENV"

      - name: Build
        working-directory: xeeonos-extensions
        run: |
          mkdir -p "$WORK/pkgcache"
          MKEXT_WORK=$WORK/mkext MKEXT_CACHE=$WORK/pkgcache \
            tools/mkext.sh "$WORK/pkgdb.tar" "$VERSION" "$SNAPSHOT" "$WORK/out" \
            $(tools/requires.sh "$NAME") "$NAME"
          sudo rm -rf "$WORK/mkext"
          ls -lh "$WORK/out"

      - name: Check the image
        working-directory: xeeonos-extensions
        run: tools/check.sh "$VERSION" "$WORK/out" "$NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Try it on this build (virtual machine)
        working-directory: xeeonos-extensions
        env:
          BOOT_TEST: ${{ github.workspace }}/xeeonos/tools/boot-test.sh
        run: tools/boot-check.sh "$VERSION" "$NAME" "$WORK/out" "$WORK/system"

  # One check with a fixed name, for the branch rules of stable. Green when
  # the extensions are not tried (pull requests to testing).
  extensions:
    name: Test optional extensions
    needs: [build, extensions-plan, extension]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.extensions-plan.result }}
          BUILD: ${{ needs.build.result }}
          EXTENSIONS: ${{ needs.extension.result }}
        run: |
          echo "plan: $PLAN, build: $BUILD, extensions: $EXTENSIONS"
          [[ $PLAN == skipped ]] && exit 0
          [[ $PLAN == success && $BUILD == success && $EXTENSIONS =~ ^(success|skipped)$ ]]

  # Publishing: only for pushes to testing, or a stable version (stable.yml,
  # through workflow_call), after every test passed.
  publish:
    name: Publish update to ghcr.io
    needs: [test, stable-update, extensions]
    if: >-
      !cancelled() && (github.event_name == 'push' || inputs.version != '') &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.stable-update.result) &&
      needs.extensions.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release with the ISO
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Compute version and release target
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          echo "CHANNEL=$(tools/version.sh --channel)" >> "$GITHUB_ENV"
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download the system update files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-system
          path: out/update

      - name: Sign and push
        if: env.CHANNEL != ''
        env:
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::warning::XEEONOS_SIGNING_KEY is not set: update not published"
            exit 0
          fi
          export GNUPGHOME=$RUNNER_TEMP/release-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --batch --yes --local-user "$key" --detach-sign \
            --output out/update/SHA256SUMS.gpg out/update/SHA256SUMS

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" oras
          oras=$RUNNER_TEMP/oras
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd out/update
          "$oras" push "$repo:$VERSION" --artifact-type application/vnd.xeeonos.update.v1 ./*
          "$oras" tag "$repo:$VERSION" "$CHANNEL"
          echo "Published $repo:$VERSION (channel $CHANNEL)" >> "$GITHUB_STEP_SUMMARY"

      # The extensions' repository builds the optional extensions for this
      # version (a pull request that merges by itself when green).
      - name: Tell xeeonos-extensions
        if: env.CHANNEL != ''
        env:
          GH_TOKEN: ${{ secrets.XEEONOS_BOT_TOKEN }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::warning::XEEONOS_BOT_TOKEN is not set: xeeonos-extensions not told about $VERSION"
            exit 0
          fi
          gh api "repos/${{ github.repository_owner }}/xeeonos-extensions/dispatches" \
            -f event_type=xeeonos-published \
            -f "client_payload[version]=$VERSION" -f "client_payload[channel]=$CHANNEL"
          echo "xeeonos-extensions told about $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the network ISO
        if: env.CHANNEL != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xeeonos-iso-net
          path: out/iso

      # The network ISO the tests installed from (live system only: it
      # downloads the system from its channel, signed like every update),
      # on GitHub Releases (docs/updates.md). The full ISO, over GitHub's
      # 2 GiB limit, stays in the run's artifact xeeonos-iso.
      # testing -> pre-release v26.11-testing.42, and only the newest one is
      # kept (older testing pre-releases and their tags are deleted);
      # stable  -> release v26.12.2 marked "Latest", all kept.
      # With SHA256SUMS signed by the update signing key. The release makes
      # the tag v<version> on the commit that was built.
      - name: Publish the ISO on GitHub Releases
        if: env.CHANNEL != ''
        env:
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::warning::XEEONOS_SIGNING_KEY is not set: ISO not published"
            exit 0
          fi
          cd out/iso
          iso=xeeonos-$VERSION-net.iso
          size=$(stat -c %s "$iso")
          if (( size >= 2 * 1024 * 1024 * 1024 )); then
            echo "::warning::$iso is $((size / 1024 / 1024)) MiB, over the 2 GiB limit of GitHub Releases: ISO not published"
            exit 0
          fi
          sha256sum "$iso" > SHA256SUMS
          export GNUPGHOME=$RUNNER_TEMP/iso-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --batch --yes --local-user "$key" --detach-sign --output SHA256SUMS.gpg SHA256SUMS

          notes="XeeonOS $VERSION (channel $CHANNEL). Network ISO: it starts the live system and downloads XeeonOS while installing, so it needs the Internet. Check the download: gpgv --keyring <XeeonOS key> SHA256SUMS.gpg SHA256SUMS && sha256sum -c SHA256SUMS"
          flags=(--latest)
          [[ $CHANNEL == testing ]] && flags=(--prerelease --latest=false)
          gh release create "v$VERSION" "$iso" SHA256SUMS SHA256SUMS.gpg \
            --target "$TARGET" --title "XeeonOS $VERSION" --notes "$notes" "${flags[@]}"
          if [[ $CHANNEL == testing ]]; then
            # Only the newest testing pre-release stays: older ones go, with their tags.
            gh release list --limit 100 --json tagName \
              --jq ".[].tagName | select(test(\"-testing\\\\.[0-9]+$\") and . != \"v$VERSION\")" |
              while read -r old; do
                gh release delete "$old" --yes --cleanup-tag
              done
          fi
          echo "ISO on GitHub Releases: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
