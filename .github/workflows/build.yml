name: Build

# Channel branches: `experimental` now, later `<N>.x/alpha|beta|stable`.
# Pull requests build and test, but never publish anything.
on:
  push:
    branches: [experimental, '*.x/alpha', '*.x/beta', '*.x/stable']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The jobs form a chain: each one starts only if the previous one passed.
#
#   xctl -> build -> disk tests -> ISO -> publish (channel branches only)
#
# Everything is built once, in `build`; the test jobs use what it built
# (artifacts of this run, kept 3 days), so a failed test can be re-run on its
# own in a few minutes. Every run builds from scratch: nothing is shared
# between runs or pull requests.
jobs:
  xctl:
    name: xctl (format, lint, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xctl
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build system, next version and live image
    needs: xctl
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install mkosi
        uses: systemd/mkosi@v27.1

      - name: Free disk space (three images are built)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends zstd
          df -h /

      - name: Compute version
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          # The "next" version, built only to test updating to it.
          echo "NEXT=$(tools/version.sh).1" >> "$GITHUB_ENV"

      # The system: the full disk image (first-boot tests) and its update
      # files (installed by the ISO, published on channel branches).
      - name: Build the system
        run: |
          mkdir -p mkosi.cache out/disk-image
          mkosi --force --image-version="$VERSION" build
          ls -lhs mkosi.output/
          zstd -T0 --quiet "mkosi.output/xeeonos_$VERSION.raw" -o "out/disk-image/xeeonos_$VERSION.raw.zst"
          tools/mkupdate.sh mkosi.output "$VERSION" out/update-system
          rm -rf mkosi.output

      - name: Build the next version (for the update test)
        run: |
          mkosi --force --image-version="$NEXT" build
          tools/mkupdate.sh mkosi.output "$NEXT" out/update-next
          rm -rf mkosi.output

      - name: Build the live image (UKI)
        run: |
          mkosi --force --profile=live --image-version="$VERSION" build
          mkdir -p out/live
          mv "mkosi.output/xeeonos_$VERSION.efi" out/live/
          rm -rf mkosi.output
          ls -lhR out/

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: disk-image
          path: out/disk-image/
          retention-days: 3
          compression-level: 0

      - name: Upload the system update files
        uses: actions/upload-artifact@v4
        with:
          name: update-system
          path: out/update-system/
          retention-days: 3
          compression-level: 0

      - name: Upload the next version's update files
        uses: actions/upload-artifact@v4
        with:
          name: update-next
          path: out/update-next/
          retention-days: 3
          compression-level: 0

      - name: Upload the live image
        uses: actions/upload-artifact@v4
        with:
          name: live
          path: out/live/
          retention-days: 3

  disk:
    name: Test first boot, A/B update, rollback, setup and Recovery
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Compute version
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          echo "NEXT=$(tools/version.sh).1" >> "$GITHUB_ENV"
          # A broken version after the next one, to test the automatic fallback.
          echo "BROKEN=$(tools/version.sh).2" >> "$GITHUB_ENV"

      - name: Download the disk image and the next version
        uses: actions/download-artifact@v4
        with:
          pattern: '{disk-image,update-next}'
          path: build

      - name: Create a throwaway signing key, sign the next version
        run: |
          export GNUPGHOME=$RUNNER_TEMP/test-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "XeeonOS CI test key" ed25519 sign 1d
          gpg --export > "$RUNNER_TEMP/test-keyring.gpg"
          gpg --batch --yes --local-user "XeeonOS CI test key" --detach-sign \
            --output build/update-next/SHA256SUMS.gpg build/update-next/SHA256SUMS

      - name: "Test 1: first boot, sealed /usr"
        run: |
          mkdir -p out
          zstd -d --sparse --quiet "build/disk-image/xeeonos_$VERSION.raw.zst" -o out/disk.raw
          rm -rf build/disk-image
          tools/boot-test.sh out/disk.raw out/serial-1-firstboot.log

      - name: "Test 2: update to the next version over HTTP"
        # systemd.run= replaces the boot target, so the normal services
        # (network included) are not started: start the network first.
        run: |
          tools/boot-test.sh \
            --http build/update-next \
            --credential "xctl.keyring=$RUNNER_TEMP/test-keyring.gpg" \
            --run "/bin/sh -c 'systemctl start network-online.target && /usr/bin/xctl update --from http://10.0.2.2:8080 --keyring /run/credentials/@system/xctl.keyring'" \
            --expect "XeeonOS $NEXT is installed" \
            out/disk.raw out/serial-2-update.log

      - name: "Test 3: the next version boots from slot B"
        run: |
          tools/boot-test.sh \
            --expect "XeeonOS $NEXT \(build" \
            --expect "xeeonos_$NEXT  \(running\)" \
            --expect "xeeonos_${VERSION}[[:space:]]*\$" \
            --expect "$NEXT +good, running" \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-3-after-update.log

      - name: "Test 4: xctl rollback"
        run: |
          tools/boot-test.sh \
            --run "/usr/bin/xctl rollback" \
            --expect "XeeonOS $NEXT is disabled. Restart to go back to XeeonOS $VERSION\." \
            out/disk.raw out/serial-4-rollback.log

      - name: "Test 5: the previous version boots again"
        run: |
          tools/boot-test.sh \
            --expect "XeeonOS $VERSION \(build" \
            --expect "$VERSION +good, running" \
            --expect "$NEXT +bad" \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-5-after-rollback.log

      - name: "Test 6: install a broken version"
        # The next version under a newer number, with the start of its /usr
        # overwritten: it installs fine (the files match the signed manifest)
        # but cannot start, because dm-verity refuses the damaged blocks.
        run: |
          src=out/broken-src
          mkdir -p "$src"
          cp "build/update-next/xeeonos_$NEXT.efi" "$src/xeeonos_$BROKEN.efi"
          for f in build/update-next/xeeonos_"$NEXT".usr-*.raw.zst; do
            name=$(basename "$f" .zst)
            zstd -d --sparse --quiet "$f" -o "$src/xeeonos_$BROKEN${name#xeeonos_$NEXT}"
          done
          dd if=/dev/urandom of="$(echo "$src"/xeeonos_"$BROKEN".usr-x86-64.*.raw)" \
            bs=1M count=1 conv=notrunc
          GNUPGHOME=$RUNNER_TEMP/test-gnupg SIGNING_KEY="XeeonOS CI test key" \
            tools/mkupdate.sh "$src" "$BROKEN" out/update-broken
          rm -rf "$src"
          tools/boot-test.sh \
            --http out/update-broken \
            --credential "xctl.keyring=$RUNNER_TEMP/test-keyring.gpg" \
            --run "/bin/sh -c 'systemctl start network-online.target && /usr/bin/xctl update --from http://10.0.2.2:8080 --keyring /run/credentials/@system/xctl.keyring'" \
            --expect "XeeonOS $BROKEN is installed" \
            out/disk.raw out/serial-6-update-broken.log

      - name: "Test 7: after 3 failed attempts, the previous version starts"
        run: |
          TIMEOUT=900 tools/boot-test.sh --allow-reboot \
            --expect "XeeonOS: this version failed to start; restarting" \
            --expect "XeeonOS $VERSION \(build" \
            --expect "$VERSION +good, running" \
            --expect "$BROKEN +bad" \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-7-fallback.log

      - name: "Test 8: first-boot setup (unattended), no Arch tools"
        run: |
          printf '%s\n' language=it_IT.UTF-8 hostname=xeeonos-ci user=test \
            "fullname=Test User" password=test-password admin=yes > out/setup.txt
          tools/boot-test.sh \
            --setup out/setup.txt \
            --run "/bin/sh -c 'id -nG test; cat /etc/locale.conf /etc/vconsole.conf; test -e /usr/bin/pacman || echo NO-PACMAN; locale -a | grep -q de_DE.utf8 && echo HAS-GERMAN; xctl packages systemd-libs; xctl install-system --disk /dev/vda --yes; xctl status --check'" \
            --expect "XeeonOS setup: created user test \(administrator\)" \
            --expect "test wheel" \
            --expect "LANG=it_IT.UTF-8" \
            --expect "KEYMAP=it" \
            --expect "NO-PACMAN" \
            --expect "HAS-GERMAN" \
            --expect "systemd-libs [0-9]" \
            --expect "already installed and running here" \
            --expect "Based on: +Arch Linux \(snapshot " \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-8-setup.log

      - name: "Test 9: Recovery (factory reset)"
        # The boot menu has a Recovery entry for each version; booting with
        # its command line erases the data partition (the user is gone).
        run: |
          tools/boot-test.sh \
            --cmdline systemd.factory_reset=1 \
            --run "/bin/sh -c 'bootctl list | grep -i recovery; id test || echo USER-GONE; xctl status --check'" \
            --expect "Recovery" \
            --expect "USER-GONE" \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-9-reset.log

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-disk
          path: out/serial-*.log
          if-no-files-found: ignore

  iso:
    name: Pack live ISO, test boot and installation
    needs: disk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            dosfstools mtools xorriso qemu-system-x86 ovmf zstd

      - name: Compute version
        run: echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"

      - name: Download the live image and the system to install
        uses: actions/download-artifact@v4
        with:
          pattern: '{live,update-system}'
          path: build

      # The ISO carries the system to install: the same files as an update.
      - name: Pack ISO
        run: |
          mkdir -p out
          tools/mkiso.sh "build/live/xeeonos_$VERSION.efi" "out/xeeonos-$VERSION.iso" build/update-system
          ls -lh out/

      - name: "Test 1: the live system boots"
        run: tools/boot-test.sh "out/xeeonos-$VERSION.iso" out/serial-live.log

      - name: "Test 2: install on a blank disk"
        run: |
          tools/boot-test.sh \
            --disk out/target.raw \
            --run "/bin/sh -c '/usr/bin/xctl install-system --disk /dev/vda --yes && exit 0; echo DIAG; ls -l /dev/disk/by-label; lsblk; ls /usr/lib/modules/*/kernel/drivers | head; journalctl -k -b --no-pager | grep -i -e sr0 -e sr_mod -e initramfs -e ahci -e ata; exit 1'" \
            --expect "XeeonOS $VERSION is installed on /dev/vda" \
            "out/xeeonos-$VERSION.iso" out/serial-install.log

      - name: "Test 3: the installed system boots"
        run: |
          tools/boot-test.sh \
            --expect "XeeonOS $VERSION \(build" \
            --expect "check: sealed system OK" \
            out/target.raw out/serial-installed.log
          rm out/target.raw

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeeonos-iso
          path: out/*.iso
          retention-days: 14
          compression-level: 0

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-live
          path: out/serial-*.log
          if-no-files-found: ignore

  # Publishing: only for pushes to a channel branch, after every test passed,
  # and only once the signing key exists in the repository secrets
  # (XEEONOS_SIGNING_KEY, an armored GnuPG secret key without passphrase).
  publish:
    name: Publish update to ghcr.io
    needs: iso
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          echo "CHANNEL=$(tools/version.sh --channel)" >> "$GITHUB_ENV"

      - name: Download the system update files
        uses: actions/download-artifact@v4
        with:
          name: update-system
          path: out/update

      - name: Sign and push
        if: env.CHANNEL != ''
        env:
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::warning::XEEONOS_SIGNING_KEY is not set: update not published"
            exit 0
          fi
          export GNUPGHOME=$RUNNER_TEMP/release-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --batch --yes --local-user "$key" --detach-sign \
            --output out/update/SHA256SUMS.gpg out/update/SHA256SUMS

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" oras
          oras=$RUNNER_TEMP/oras
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd out/update
          "$oras" push "$repo:$VERSION" --artifact-type application/vnd.xeeonos.update.v1 ./*
          "$oras" tag "$repo:$VERSION" "$CHANNEL"
          echo "Published $repo:$VERSION (channel $CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
