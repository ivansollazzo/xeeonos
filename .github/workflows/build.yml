name: Build

# Channel branches: `experimental` now, later `<N>.x/alpha|beta|stable`.
# Pull requests build and test, but never publish anything.
on:
  push:
    branches: [experimental, '*.x/alpha', '*.x/beta', '*.x/stable']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xctl:
    name: xctl (format, lint, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xctl
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  disk:
    name: Build disk image, test first boot and A/B update
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mkosi
        uses: systemd/mkosi@v27.1

      - name: Free disk space (two images are built)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Compute version
        run: |
          echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"
          echo "CHANNEL=$(tools/version.sh --channel)" >> "$GITHUB_ENV"
          # The "next" version, built only to test updating to it.
          echo "NEXT=$(tools/version.sh).1" >> "$GITHUB_ENV"

      - name: Build disk image
        run: |
          mkdir -p mkosi.cache
          mkosi --force --image-version="$VERSION" build
          ls -lhs mkosi.output/

      - name: Build next version (for the update test)
        run: |
          mkosi --force --image-version="$NEXT" --output-directory=mkosi.output/next build
          ls -lhs mkosi.output/next/

      - name: Create a throwaway signing key for the tests
        run: |
          export GNUPGHOME=$RUNNER_TEMP/test-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "XeeonOS CI test key" ed25519 sign 1d
          gpg --export > "$RUNNER_TEMP/test-keyring.gpg"

      - name: "Test 1: first boot, sealed /usr"
        run: |
          mkdir -p out
          mv "mkosi.output/xeeonos_$VERSION.raw" out/disk.raw
          tools/boot-test.sh out/disk.raw out/serial-1-firstboot.log

      - name: "Test 2: update to the next version over HTTP"
        # systemd.run= replaces the boot target, so the normal services
        # (network included) are not started: start the network first.
        run: |
          GNUPGHOME=$RUNNER_TEMP/test-gnupg SIGNING_KEY="XeeonOS CI test key" \
            tools/mkupdate.sh mkosi.output/next "$NEXT" out/update-next
          tools/boot-test.sh \
            --http out/update-next \
            --credential "xctl.keyring=$RUNNER_TEMP/test-keyring.gpg" \
            --run "/bin/sh -c 'systemctl start network-online.target && /usr/bin/xctl update --from http://10.0.2.2:8080 --keyring /run/credentials/@system/xctl.keyring'" \
            --expect "XeeonOS $NEXT is installed" \
            out/disk.raw out/serial-2-update.log

      - name: "Test 3: the next version boots from slot B"
        run: |
          tools/boot-test.sh \
            --expect "XeeonOS $NEXT \(build" \
            --expect "xeeonos_$NEXT  \(running\)" \
            --expect "xeeonos_${VERSION}[[:space:]]*\$" \
            --expect "check: sealed system OK" \
            out/disk.raw out/serial-3-after-update.log

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-disk
          path: out/serial-*.log
          if-no-files-found: ignore

      # Publishing: only for pushes to a channel branch, and only once the
      # signing key exists in the repository secrets (XEEONOS_SIGNING_KEY,
      # an armored GnuPG secret key without passphrase).
      - name: Publish update to ghcr.io
        if: github.event_name == 'push' && env.CHANNEL != ''
        env:
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::warning::XEEONOS_SIGNING_KEY is not set: update not published"
            exit 0
          fi
          export GNUPGHOME=$RUNNER_TEMP/release-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          SIGNING_KEY=$key tools/mkupdate.sh mkosi.output "$VERSION" out/update

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" oras
          oras=$RUNNER_TEMP/oras
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd out/update
          "$oras" push "$repo:$VERSION" --artifact-type application/vnd.xeeonos.update.v1 ./*
          "$oras" tag "$repo:$VERSION" "$CHANNEL"
          echo "Published $repo:$VERSION (channel $CHANNEL)" >> "$GITHUB_STEP_SUMMARY"

  iso:
    name: Build live ISO and test boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install mkosi
        uses: systemd/mkosi@v27.1

      - name: Install ISO and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            dosfstools mtools xorriso qemu-system-x86 ovmf

      - name: Compute version
        run: echo "VERSION=$(tools/version.sh)" >> "$GITHUB_ENV"

      - name: Build live image (UKI)
        run: |
          mkdir -p mkosi.cache
          mkosi --force --profile=live --image-version="$VERSION" build
          ls -lh mkosi.output/

      - name: Pack ISO
        run: |
          mkdir -p out
          tools/mkiso.sh "mkosi.output/xeeonos_$VERSION.efi" "out/xeeonos-$VERSION.iso"
          ls -lh out/

      - name: Boot test in QEMU
        run: tools/boot-test.sh "out/xeeonos-$VERSION.iso" out/serial-live.log

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeeonos-iso
          path: out/*.iso
          retention-days: 14

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log-live
          path: out/serial-live.log
          if-no-files-found: ignore
