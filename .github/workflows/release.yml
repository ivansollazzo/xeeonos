name: Pubblica versione

# A stable version, by hand: Actions > Pubblica versione > Run workflow, on
# the branch stable. It works out the number (YY.MM.S: the month of today,
# S one more than the last version of this month: 26.12.1, 26.12.2, then
# 27.1.1 in January), builds and tests everything (build.yml) and, only if
# every test is green, publishes the signed update on the stable channel and
# tags the commit vYY.MM.S. If anything is red, nothing is published and no
# tag is made: fix it on stable and run this again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  number:
    name: Version number
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.number.outputs.version }}
    steps:
      - name: Only from stable
        if: github.ref_name != 'stable'
        run: |
          echo "::error::Run it on the branch stable (now: ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Next YY.MM.S
        id: number
        run: |
          month=$(date -u +%y.%-m)
          last=$(git tag --list "v$month.*" | sed "s/^v$month\.//" | grep -E '^[0-9]+$' | sort -n | tail -n1)
          version=$month.$(( ${last:-0} + 1 ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test, publish
    needs: number
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.number.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: write
      pull-requests: read

  tag:
    name: Tag v${{ needs.number.outputs.version }}
    needs: [number, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the commit
        env:
          VERSION: ${{ needs.number.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" --message "XeeonOS $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          echo "Published XeeonOS $VERSION (channel stable), tag v$VERSION" >> "$GITHUB_STEP_SUMMARY"
