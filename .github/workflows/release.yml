name: Create new stable

# Testing becomes the next stable version (docs/updates.md), through a pull
# request: this workflow freezes testing as it is now in a branch
# new-stable-<run> and opens a pull request from it to stable. Its checks
# run every test, the update from today's stable version, and every optional
# extension on the new images. Merge it when it is green: the merge publishes
# the next YY.MM.S by itself (stable.yml). Nothing else writes to stable.
#
# The branch and the pull request are made with XEEONOS_BOT_TOKEN: what the
# workflow's own token makes starts no checks.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-new-stable
  cancel-in-progress: false

jobs:
  propose:
    name: Open the pull request testing -> stable
    runs-on: ubuntu-24.04
    steps:
      - name: Only from testing
        if: github.ref_name != 'testing'
        run: |
          echo "::error::Run it on the testing branch (now: ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: testing
          fetch-depth: 0
          persist-credentials: false

      - name: Open it
        env:
          GH_TOKEN: ${{ secrets.XEEONOS_BOT_TOKEN }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::error::XEEONOS_BOT_TOKEN is not configured"
            exit 1
          fi
          git fetch --quiet origin +refs/heads/stable:refs/remotes/origin/stable
          changes=$(git log --oneline --no-merges origin/stable..HEAD)
          if [[ -z $changes ]]; then
            echo "Testing has nothing that stable does not have: no pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          next=$(tools/next-stable.sh)
          branch=new-stable-$GITHUB_RUN_NUMBER
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "Testing as of $(date -u '+%Y-%m-%d %H:%M UTC') ($(git rev-parse --short HEAD)) becomes the next stable version."
            echo
            echo "**Merging publishes it** as XeeonOS $next (the number is worked out at the merge: the month of that day, one more than the last stable version of the month)."
            echo
            echo "The checks run every test, the update from today's stable version (Test stable-update) and every optional extension of xeeonos-extensions on the new images (Test optional extensions)."
            echo
            echo "Changes since stable:"
            echo
            echo '```'
            head -n 200 <<< "$changes"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          url=$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=stable -f head="$branch" \
            -f title="New stable version (testing of $(date -u +%Y-%m-%d))" \
            -F body=@"$RUNNER_TEMP/body.md" --jq .html_url)
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
