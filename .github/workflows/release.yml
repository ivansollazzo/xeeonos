
name: Publish new stable

# Promote testing to stable:
# calculate the next stable version, merge testing into stable,
# then build, test and publish the exact merge commit.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote testing to stable
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.number.outputs.version }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    steps:
      - name: Only from testing
        if: github.ref_name != 'testing'
        run: |
          echo "::error::Run it on the testing branch (now: ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: testing
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch branches
        run: git fetch origin testing stable --tags

      - name: Next YY.MM.S
        id: number
        run: |
          month=$(date -u +%y.%-m)
          last=$(git tag --merged origin/stable --list "v$month.*" |
            sed "s/^v$month\\.//" |
            awk '/^[0-9]+$/ { print }' |
            sort -n |
            tail -n1)

          version=$month.$(( ${last:-0} + 1 ))

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Stable version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge testing into stable
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B stable origin/stable
          git merge --no-ff --no-edit origin/testing

          merge_sha=$(git rev-parse HEAD)
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Promoted commit: $merge_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Push stable
        env:
          GH_TOKEN: ${{ secrets.XEEONOS_BOT_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::XEEONOS_BOT_TOKEN is not configured"
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin HEAD:refs/heads/stable

  build:
    name: Build, test and publish stable
    needs: promote
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      ref: ${{ needs.promote.outputs.merge_sha }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      packages: write
      pull-requests: read
