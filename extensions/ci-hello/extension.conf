# Extension ci-hello (optional): the test extension of the CI
# (tools/ci/extensions.sh), one small program and one of each hook
# (scripts in files/usr/lib/xeeonos/extensions/ci-hello/). The real
# optional extensions are built for every version in the repository
# xeeonos-extensions.
Description="Test extension of the CI: the program xeeonos-hello"
Special=no
Default=no
Packages=""
# A harmless unit of the system, masked while the extension is on.
Disable="systemd-tmpfiles-clean.timer"
Setup=setup
Cleanup=cleanup
Boot=boot
