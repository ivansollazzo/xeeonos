# Extension flatpak (included, special): applications from Flathub, for the
# whole system, with Discover as the app store (docs/flatpak.md).
# Flathub is set up by files/usr/share/flatpak/remotes.d/.
Description="Applications from Flathub (Flatpak), with Discover as the app store"
Special=yes
Default=yes
Packages="flatpak discover flatpak-kcm"
