# Extension flatpak (included, special): applications from Flathub, for the
# whole system, with GNOME Software as the app store (docs/flatpak.md).
# Flathub is set up by files/usr/share/flatpak/remotes.d/. The default
# applications of the desktop (its preinstall.d list) are installed in the
# background as soon as there is a network (xeeonos-flatpak-preinstall),
# unless the first-boot setup was told not to.
Description="Applications from Flathub (Flatpak), with GNOME Software as the app store"
Special=yes
Default=yes
Packages="flatpak gnome-software"
Enable="xeeonos-flatpak-preinstall.timer"
