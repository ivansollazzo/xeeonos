# Extension flatpak (included, special): applications from Flathub, for the
# whole system, with GNOME Software as the app store (docs/flatpak.md).
# Flathub is set up by files/usr/share/flatpak/remotes.d/.
Description="Applications from Flathub (Flatpak), with GNOME Software as the app store"
Special=yes
Default=yes
Packages="flatpak gnome-software"
