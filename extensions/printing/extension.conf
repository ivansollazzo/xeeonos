# Extension printing (included, special): printers (docs/printing.md).
# CUPS with its filters (driverless printing: IPP Everywhere, AirPrint),
# Avahi with nss-mdns to find the printers of the local network, and
# Plasma's Printers page.
Description="Printers: CUPS, network printers, the Printers page of System Settings"
Special=yes
Default=yes
Packages="cups cups-filters avahi nss-mdns print-manager"
# CUPS starts on demand, at the first use of a printer; Avahi finds the
# printers of the local network.
Enable="cups.socket avahi-daemon.service avahi-daemon.socket"
