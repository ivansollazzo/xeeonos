# Name Service Switch configuration file.
# See nsswitch.conf(5) for details.
#
# With the extension printing: Arch's file, plus mdns_minimal in "hosts", so
# that names like printer.local (how network printers announce themselves)
# are resolved through Avahi. /etc/nsswitch.conf is a link to this file.

passwd: files systemd
group: files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

publickey: files

hosts: mymachines mdns_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
