# Extension scanner (included, special): scanners (docs/scanner.md). SANE
# with sane-airscan (driverless scanning: eSCL and WSD, the way most
# scanners and all-in-one printers of the last ten years work, over the
# network or USB), ipp-usb (USB devices speak IPP and eSCL over USB; it
# starts by itself when one is plugged in), Avahi to find them, and
# Document Scanner. Document Scanner is here and not from Flathub because it
# needs the system's SANE and its drivers.
Description="Scanners: SANE, driverless scanning (network and USB), Document Scanner"
Special=yes
Default=yes
Packages="sane sane-airscan ipp-usb simple-scan avahi"
# Avahi finds the scanners of the local network and those behind ipp-usb
# (also started by the extension printing: the same service).
Enable="avahi-daemon.service avahi-daemon.socket"
