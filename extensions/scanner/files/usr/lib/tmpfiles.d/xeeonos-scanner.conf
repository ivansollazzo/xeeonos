# /etc starts empty on XeeonOS (see etc.conf): what scanning needs there,
# the package defaults kept in /usr/share/factory/etc and linked. To change
# them (for example a scanner that is not found by itself, in
# /etc/sane.d/airscan.conf), replace the link with a copy.
L? /etc/sane.d
L? /etc/ipp-usb
# Also in the extension printing: with both on, systemd-tmpfiles notes the
# duplicate line and keeps one.
L? /etc/avahi
