# Extension xapp (included, special): XeeonOS applications, one file each
# (docs/xapp.md). Put a .xapp in ~/Applications and it is in the menu,
# delete it and it is gone; every application runs in its own sandbox
# (bubblewrap, seccomp, a filtered session bus), with its own minimal Arch
# system mounted read-only from the file (erofsfuse) and the permissions
# the user gave it. The program `xapp` is compiled by build.sh; the monitor
# of ~/Applications is a user unit (xapp-sync.path).
Description="XeeonOS applications (.xapp): one file per application in ~/Applications, each in its own sandbox"
Special=yes
Default=yes
Packages="bubblewrap xdg-dbus-proxy erofs-utils fuse3"
