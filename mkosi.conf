# XeeonOS image definition.
#
# XeeonOS is built from modules (see docs/modules.md):
#   mkosi.conf.d/<module>/   core modules, always included
#   mkosi.profiles/<module>/ optional modules, selected with --profile=
# This file only holds the settings shared by every module.
# Reference: mkosi v27.1, `man mkosi`.

[Distribution]
Distribution=arch
Architecture=x86-64
# Every build is pinned to one dated snapshot of the Arch Linux Archive
# (https://archive.archlinux.org/repos/YYYY/MM/DD), so builds are reproducible.
# Bump this date to move XeeonOS forward.
Snapshot=2026/11/10

[Output]
ImageId=xeeonos
# The version comes from mkosi.version (the base version, e.g. 0.1.0). CI passes
# the full version computed by tools/version.sh with --image-version=.
OutputDirectory=mkosi.output
# Write the list of packages (name, version) next to the image; it is
# published with every update.
ManifestFormat=json

[Build]
# Build with a pinned Arch tools tree, so the host distribution does not matter.
ToolsTree=yes
ToolsTreeDistribution=arch
# Package downloads are reused between builds when this directory exists.
CacheDirectory=mkosi.cache
# The installed packages (and the tools tree) are kept in the cache directory
# after the first build, so the next builds of the same run (next version,
# live image) only redo the XeeonOS-specific steps. CI starts every run with
# an empty cache.
Incremental=yes
