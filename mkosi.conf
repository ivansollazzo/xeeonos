# XeeonOS image definition (Phase 0: minimal Arch base, booted as a live UKI).
# Reference: mkosi v27.1, `man mkosi`.

[Distribution]
Distribution=arch
Architecture=x86-64
# Every build is pinned to one dated snapshot of the Arch Linux Archive
# (https://archive.archlinux.org/repos/YYYY/MM/DD), so builds are reproducible.
# Bump this date to move XeeonOS forward.
Snapshot=2026/11/10

[Output]
ImageId=xeeonos
ImageVersion=0.0.1
OutputDirectory=mkosi.output
# Phase 0: the whole OS is packed into the initrd of a Unified Kernel Image and
# runs from RAM. Phase 1 replaces this with A/B /usr partitions (erofs + dm-verity).
Format=uki

[Content]
Packages=
        base
        linux
        intel-ucode
        amd-ucode
        # Firmware, limited to the supported hardware: Intel, AMD and Nouveau GPUs,
        # plus common Wi-Fi/Ethernet chips.
        linux-firmware-intel
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-nvidia
        linux-firmware-realtek
        linux-firmware-atheros
        linux-firmware-mediatek
        networkmanager
        sudo
        nano
        less

Hostname=xeeonos
Locale=C.UTF-8
# Live system: log in automatically as root on the console.
Autologin=yes
KernelCommandLine=console=tty0 console=ttyS0,115200

[Build]
# Build with a pinned Arch tools tree, so the host distribution does not matter.
ToolsTree=yes
ToolsTreeDistribution=arch
