# Module: base
# The minimal XeeonOS system: kernel, systemd, networking, identity
# (firmware and file system tools: module drivers).

[Content]
# Arch's `base` group without its package manager: XeeonOS changes only as a
# whole, through `xctl update`, so pacman has no place in the image.
Packages=
        filesystem
        bash
        coreutils
        findutils
        grep
        sed
        gawk
        tar
        gzip
        bzip2
        xz
        file
        gettext
        procps-ng
        psmisc
        pciutils
        shadow
        util-linux
        iproute2
        iputils
        licenses
        systemd
        systemd-sysvcompat
        # Every language, ready to use: the language can be changed at any
        # time without generating anything (no locale-gen).
        glibc-locales
        # zstd (update files): used by the installer and Recovery. In the
        # base, so that the system and the live image share the same
        # packages (one package install per CI run). File systems, firmware
        # and processor microcode are in the module drivers.
        zstd
        linux
        networkmanager
        # Bluetooth, like Wi-Fi: also for a keyboard or a mouse.
        bluez
        bluez-utils
        # Swap in compressed memory (usr/lib/systemd/zram-generator.conf).
        zram-generator
        # whiptail: the dialog windows of xctl (installer, setup, Recovery)
        libnewt
        sudo
        nano
        less

Hostname=xeeonos
Locale=C.UTF-8

# Removed at the end of the build: they were needed to install the packages,
# not to run XeeonOS. With pacman gone, mkosi also removes the package
# database; the list of packages stays in /usr/share/xeeonos/packages
# (`xctl packages`) and in the build manifest.
RemovePackages=
        pacman
        pacman-mirrorlist
        archlinux-keyring
