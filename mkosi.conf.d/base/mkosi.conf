# Module: base
# The minimal XeeonOS system: kernel, firmware, systemd, networking, identity.

[Content]
# Arch's `base` group without its package manager: XeeonOS changes only as a
# whole, through `xctl update`, so pacman has no place in the image.
Packages=
        filesystem
        bash
        coreutils
        findutils
        grep
        sed
        gawk
        tar
        gzip
        bzip2
        xz
        file
        gettext
        procps-ng
        psmisc
        pciutils
        shadow
        util-linux
        iproute2
        iputils
        licenses
        systemd
        systemd-sysvcompat
        # Every language, ready to use: the language can be changed at any
        # time without generating anything (no locale-gen).
        glibc-locales
        # FAT (EFI System Partition) and zstd (update files): used by the
        # installer and Recovery. In the base, so that the system and the
        # live image share the same packages (one package install per CI run).
        dosfstools
        zstd
        linux
        intel-ucode
        amd-ucode
        # Firmware, limited to the supported hardware: Intel, AMD and Nouveau GPUs,
        # plus common Wi-Fi/Ethernet chips.
        linux-firmware-intel
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-nvidia
        linux-firmware-realtek
        linux-firmware-atheros
        linux-firmware-mediatek
        networkmanager
        # whiptail: the dialog windows of xctl (installer, setup, Recovery)
        libnewt
        sudo
        nano
        less

Hostname=xeeonos
Locale=C.UTF-8

# Removed at the end of the build: they were needed to install the packages,
# not to run XeeonOS. With pacman gone, mkosi also removes the package
# database; the list of packages stays in /usr/share/xeeonos/packages
# (`xctl packages`) and in the build manifest.
RemovePackages=
        pacman
        pacman-mirrorlist
        archlinux-keyring
