# Swap in compressed memory (zram), used first (priority 100): fast, no
# writes to the disk, and nothing to set up. The installed system also has a
# swap file behind it (priority 10; xeeonos-swapfile.service). Half of the RAM at most, up to
# 8 GiB; zstd compresses about 3:1, so it holds much more than it uses.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
