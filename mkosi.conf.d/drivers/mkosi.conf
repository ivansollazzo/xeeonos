# Module: drivers
# What makes the hardware and the disks work, beyond the kernel: file
# systems, processor microcode, firmware for graphics, Wi-Fi, Bluetooth and
# sound, USB modems (docs/drivers.md). Limited to the supported hardware:
# Intel, AMD and Nouveau graphics (no NVIDIA proprietary driver). Also in
# the live ISO, so that it already works on the computer it installs, and
# reads every disk. btrfs-progs and cryptsetup are in the module system:
# they are the system itself.

[Content]
Packages=
        # File systems: FAT (EFI System Partition, USB sticks), exFAT (USB
        # sticks, SD cards), NTFS (Windows disks: check and repair), ext4
        # (external disks). The kernel reads all of them; these are the
        # tools to create, check and repair them.
        dosfstools
        exfatprogs
        ntfs-3g
        e2fsprogs
        # Processor microcode (security and stability fixes), loaded early.
        intel-ucode
        amd-ucode
        # Firmware: Intel, AMD and Nouveau graphics, common Wi-Fi, Ethernet
        # and Bluetooth chips (Intel, Realtek, Atheros, MediaTek, Broadcom).
        linux-firmware-intel
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-nvidia
        linux-firmware-realtek
        linux-firmware-atheros
        linux-firmware-mediatek
        linux-firmware-broadcom
        # Sound of recent Intel and AMD laptops (Sound Open Firmware, ALSA
        # use-case profiles), and the speaker amplifiers of many laptops
        # (Cirrus Logic: Lenovo, Dell, ASUS, HP).
        sof-firmware
        alsa-ucm-conf
        linux-firmware-cirrus
        # Wi-Fi: the channels and power allowed in each country.
        wireless-regdb
        # USB 4G modems and adapters that first show up as a CD-ROM.
        usb_modeswitch
