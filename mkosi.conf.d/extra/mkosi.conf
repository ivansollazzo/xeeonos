# Module: extra
# Services every installed XeeonOS has, whatever the desktop: sound
# (PipeWire) and Bluetooth. Not in the live ISO, which runs from RAM and
# only installs.

[Match]
Profiles=!live

[Content]
Packages=
        pipewire
        pipewire-pulse
        pipewire-alsa
        pipewire-jack
        wireplumber
        bluez
