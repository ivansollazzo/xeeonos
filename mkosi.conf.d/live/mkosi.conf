# Module: live
# Phase 0 delivery format: the whole OS is packed into the initrd of a Unified
# Kernel Image and runs from RAM, logged in as root. Phase 1 replaces this module
# with A/B /usr partitions (erofs + dm-verity) and an installer.

[Output]
Format=uki

[Content]
Autologin=yes
# systemd.firstboot=no: no interactive first-boot questions in the live system
# (the XeeonOS setup assistant replaces them on installed systems).
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.firstboot=no
