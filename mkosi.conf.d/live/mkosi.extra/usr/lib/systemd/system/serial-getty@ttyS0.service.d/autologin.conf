# Live system: autologin as root on the first serial console too.
# mkosi's Autologin= covers tty1 and hvc0 only (same drop-in format as mkosi).
[Service]
ExecStart=
ExecStart=-agetty -o '-f -p -- \\u' --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
StandardInput=tty
StandardOutput=tty
