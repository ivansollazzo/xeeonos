# Module: system
# The installed XeeonOS system: a sealed, image-based disk.
#
#   ESP           systemd-boot + one Unified Kernel Image per version
#   /usr slot A   erofs, read-only, protected by dm-verity
#   /usr slot B   empty, created at first boot, receives the next update
#   root (data)   Btrfs, created at first boot: /etc, /var, /home
#
# The UKI carries the verity root hash of its /usr (usrhash=), so a kernel can
# only ever mount the exact /usr it was built with. The live ISO (profile
# `live`) does not use this module.

[Match]
Profiles=!live

[Output]
Format=disk
# Besides the full disk image, write the pieces an update is made of: the UKI
# and the /usr + verity partitions as separate files (see tools/mkupdate.sh).
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
# One UKI per version, e.g. xeeonos_0.1.0-experimental.42.efi, so that
# systemd-sysupdate can install and remove them side by side.
# (Partition labels are limited to 36 characters, which is why the version
# carries the CI run number but not the build date; the date is in BUILD_ID.)
UnifiedKernelImageFormat=%i_%v
# Every kernel also carries the "Recovery" (factory reset) boot entry.
UnifiedKernelImageProfiles=recovery.profile
Packages=
        btrfs-progs
        cryptsetup
        dosfstools

# root=/mount.usr=dissect: find / and /usr from the GPT partition types
# (Discoverable Partitions Specification) instead of hardcoded device names.
# image_policy: /usr must be verity-protected; root may be absent on the very
# first boot, until systemd-repart has created it.
# image_filter: only partitions labeled by XeeonOS are used.
# panic=10: after a kernel panic, restart after 10 seconds, so that a version
# that cannot start falls back to the previous one (see docs/rollback.md).
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=verity:root=unprotected+absent:swap=unprotected+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=xeeonos_*:usr-verity=xeeonos_*:root=xeeonos-*
        panic=10
