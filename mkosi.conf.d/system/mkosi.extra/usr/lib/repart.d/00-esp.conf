# Partition layout of an installed XeeonOS disk, applied by systemd-repart at
# boot. Existing partitions are kept; missing ones are created.
#
# The EFI System Partition always exists already (made by the installer or in
# the disk image). It may be the one of another system (XeeonOS installed
# next to it), of any size: Weight=0 and a small minimum, so that it is only
# recognized, never grown.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=16M
Weight=0
