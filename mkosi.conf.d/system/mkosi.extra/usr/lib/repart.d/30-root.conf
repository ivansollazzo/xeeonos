# Data partition: everything that is not the OS (/etc, /var, /home).
# It takes all remaining space. FactoryReset=yes: "reset" erases it and the
# next boot recreates it empty, leaving the OS untouched.
#
# Always encrypted (LUKS2), with an empty password at first: the computer
# starts without asking anything (the initrd tries the empty password). A
# disk password can be turned on and off at any time (`xctl encryption`,
# docs/encryption.md). EncryptKDF=minimal: the empty password needs no slow
# key derivation; a real password, added later, gets the default (argon2id).
[Partition]
Type=root
Encrypt=key-file
EncryptKDF=minimal
Format=btrfs
Label=xeeonos-root
SizeMinBytes=4G
FactoryReset=yes
# /efi and /boot: mount points for the ESP and, if XeeonOS was installed next
# to another system, its boot partition (mounted automatically by systemd).
MakeDirectories=/efi /boot /home /var/log/journal
