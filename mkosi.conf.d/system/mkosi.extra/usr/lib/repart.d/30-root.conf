# Data partition: everything that is not the OS (/etc, /var, /home).
# It takes all remaining space. FactoryReset=yes: "reset" erases it and the
# next boot recreates it empty, leaving the OS untouched.
[Partition]
Type=root
Format=btrfs
Label=xeeonos-root
SizeMinBytes=4G
FactoryReset=yes
# /efi and /boot: mount points for the ESP and, if XeeonOS was installed next
# to another system, its boot partition (mounted automatically by systemd).
MakeDirectories=/efi /boot /home /var/log/journal
