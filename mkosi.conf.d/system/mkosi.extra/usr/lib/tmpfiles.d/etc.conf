# Replaces systemd's etc.conf: on XeeonOS /etc starts empty, and the vendor
# defaults are symlinked from /usr/share/factory/etc (written at build time)
# instead of copied, so that updates of /usr update them too.
# "L" never replaces something the administrator created in /etc.
# Adapted from ParticleOS (LGPL-2.1-or-later).
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
L? /etc/locale.conf
L? /etc/vconsole.conf
L /etc/nsswitch.conf
L /etc/pam.d
L /etc/security
L /etc/environment
L /etc/profile
L /etc/profile.d
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/inputrc
L? /etc/shells
L? /etc/login.defs
L? /etc/default
L? /etc/skel
L? /etc/sudoers
L? /etc/sudoers.d
L? /etc/issue
L /etc/ssl
L? /etc/ca-certificates
L /etc/ld.so.conf
L /etc/ld.so.conf.d
L? /etc/services
L? /etc/protocols
L? /etc/man_db.conf
L? /etc/nanorc
L? /etc/xdg
L? /etc/fonts
L? /etc/wpa_supplicant
