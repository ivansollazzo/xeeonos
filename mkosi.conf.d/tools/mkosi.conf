# Module: tools
# Tools every installed XeeonOS has, whatever the desktop (docs/tools.md):
# SSH, the client, and the server, which is off until the administrator
# turns it on; FUSE 2, which AppImage files need to start; the command line
# tools that guides and scripts take for granted; Python. Containers (podman, distrobox) are optional extensions,
# in the repository xeeonos-extensions; the user ID ranges they need are
# given here, to every user, so turning them on needs nothing else.
# Not in the live ISO, which runs from RAM and only installs.

[Match]
Profiles=!live

[Content]
Packages=
        openssh
        fuse2
        # Files and archives.
        which
        tree
        rsync
        zip
        unzip
        7zip
        ncdu
        lsof
        bc
        jq
        vim
        # Manual pages, offline, and Tab completion of options and arguments.
        man-db
        man-pages
        bash-completion
        # Terminal sessions that survive a dropped SSH connection.
        tmux
        screen
        # Hardware: USB devices, model, BIOS and memory, NVMe disks,
        # temperatures and fans, what uses the battery.
        usbutils
        dmidecode
        nvme-cli
        lm_sensors
        powertop
        # Processes: what a program does (for bug reports).
        htop
        strace
        # Network: downloads, DNS (dig), path of the packets, Wi-Fi and
        # Ethernet, hostname, netcat, whois.
        wget
        bind
        traceroute
        mtr
        iw
        ethtool
        inetutils
        openbsd-netcat
        whois
        git
        # Python, with pip (libraries in a venv: python -m venv) and pipx
        # (command line programs in ~/.local/bin). /usr is read-only:
        # `sudo pip install` cannot change the system.
        python
        python-pip
        python-pipx
