# Module: tools
# Tools every installed XeeonOS has, whatever the desktop:
#   - containers: podman (the engine, without root) and distrobox (other
#     distributions and their packages in a container, the base of .xapp
#     applications and of development work);
#   - SSH: the client, and the server, which is off until the administrator
#     turns it on (docs/tools.md).
# Not in the live ISO, which runs from RAM and only installs.

[Match]
Profiles=!live

[Content]
Packages=
        podman
        distrobox
        openssh
