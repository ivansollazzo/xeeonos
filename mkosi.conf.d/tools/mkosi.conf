# Module: tools
# Tools every installed XeeonOS has, whatever the desktop: SSH, the client,
# and the server, which is off until the administrator turns it on, and
# FUSE 2, which AppImage files need to start (docs/tools.md). Containers (podman, distrobox) are optional extensions,
# in the repository xeeonos-extensions; the user ID ranges they need are
# given here, to every user, so turning them on needs nothing else.
# Not in the live ISO, which runs from RAM and only installs.

[Match]
Profiles=!live

[Content]
Packages=
        openssh
        fuse2
