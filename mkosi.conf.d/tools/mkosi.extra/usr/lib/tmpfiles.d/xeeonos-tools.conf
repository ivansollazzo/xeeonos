# /etc starts empty on XeeonOS (see etc.conf): what the tools of this module
# need there.
# Rootless containers (extensions podman, distrobox): the ranges of user IDs
# each user may use. useradd fills these files in when it creates a user
# (xctl setup), so they are ready when an extension is turned on.
f /etc/subuid 0644 root root -
f /etc/subgid 0644 root root -
# SSH: a copy, not a link: the server writes its keys there, and the
# administrator its settings.
C /etc/ssh - - - - /usr/share/factory/etc/ssh
