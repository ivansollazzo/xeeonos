# Module: xctl
# The XeeonOS system tool, written in Rust (source in xctl/ at the top of the
# repository). mkosi.build.chroot compiles it inside the image's build overlay
# and installs it as /usr/bin/xctl.

[Content]
# Only present while building, absent from the final image.
BuildPackages=
        rust

Packages=
        curl
        # gpgv verifies the signature of updates.
        gnupg
        # oras downloads updates published as OCI artifacts on ghcr.io.
        oras
