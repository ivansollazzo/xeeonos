# Extra configuration for the initrd that mkosi builds into every UKI
# (installed system and live ISO alike). mkosi only reads this file at the
# top level of the repository.
#
# mkosi.extra/: if the initrd fails while a new version is being tried
# (boot counting), restart instead of waiting at an emergency shell, so that
# systemd-boot can fall back to the previous version. See docs/rollback.md.
