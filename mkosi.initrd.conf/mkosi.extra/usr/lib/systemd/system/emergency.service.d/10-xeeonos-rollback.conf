# The initrd could not start the system (e.g. the new /usr is damaged).
# If systemd-boot is counting attempts for this version (it sets the EFI
# variable LoaderBootCountPath), restart: the next attempt, or after the last
# one the previous version, starts instead. Otherwise (a version already known
# to work, or the live ISO) open the usual emergency shell.
[Service]
ExecStart=
ExecStart=-/usr/bin/bash -c 'if [ -e /sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f ]; then echo "XeeonOS: this version failed to start; restarting."; exec systemctl reboot; fi; exec /usr/lib/systemd/systemd-sulogin-shell emergency'
