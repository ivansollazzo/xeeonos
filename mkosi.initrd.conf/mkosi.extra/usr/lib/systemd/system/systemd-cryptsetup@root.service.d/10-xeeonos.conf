# The data partition (systemd's gpt-auto generator opens it as "root") is
# always encrypted. With the disk password off, its only key is the empty
# password: try that first, so that the computer starts without asking.
# With the password on, the empty one fails and the password is asked on the
# console. When the TPM holds a key for it (xctl encryption tpm on), that is
# tried before everything else; without a TPM, or when it refuses (Secure Boot
# changed), the password is asked as usual. (The generator itself passes no
# such options, so its command is replaced here.)
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-cryptsetup attach root /dev/gpt-auto-root-luks - try-empty-password=yes,discard,tpm2-device=auto
# Right after systemd-repart has created the partition (first boot, or the
# boot after "erase everything"), udev is still announcing it: opening it
# can fail once. Wait for udev, and try again instead of leaving the boot
# without its data partition (emergency mode).
ExecStartPre=-/usr/bin/udevadm settle --timeout=30
Restart=on-failure
RestartSec=2
