# Module: flatpak (optional, `--profile=flatpak`)
# Applications from Flathub, installed for the whole system in
# /var/lib/flatpak (data partition: they survive system updates). Works with
# any desktop; the app store comes from the desktop module (Plasma: Discover).
# Flathub is set up by mkosi.extra/usr/share/flatpak/remotes.d/.

[Content]
Packages=flatpak
