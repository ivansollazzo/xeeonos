# Module: gnome (optional, `--profile=gnome`)
# The GNOME desktop, minimal: GNOME Shell on Wayland, its login screen (GDM),
# Settings (network, Bluetooth, screens, power, sound, printers in one place)
# and the applications that must be part of the system: Console, Files and
# System Monitor. Other applications come from Flathub (GNOME Software, with
# the extension flatpak). Removing this module (or replacing it with another
# desktop) leaves the rest untouched.

[Content]
Packages=
        # The desktop and the login screen.
        gnome-shell
        gdm
        gnome-session
        gnome-settings-daemon
        gnome-control-center
        gnome-keyring
        gnome-backgrounds
        xdg-desktop-portal-gnome
        xdg-user-dirs-gtk
        power-profiles-daemon
        # Contacts and Calendar (from Flathub) keep their data in the
        # system's Evolution Data Server: without it they do not start.
        evolution-data-server
        # Applications: terminal, files (also archives), processes and
        # resources. Screenshots are part of GNOME Shell.
        gnome-console
        nautilus
        gnome-system-monitor
        # Disks: format USB sticks, SMART state, disk images.
        gnome-disk-utility
        # Laptop and hardware services that GNOME uses by itself and shows
        # in Settings: fingerprint reader (login and unlock), Thunderbolt
        # and USB4 devices, automatic rotation and brightness, "Launch using
        # Discrete Graphics Card" on laptops with two GPUs.
        fprintd
        bolt
        iio-sensor-proxy
        switcheroo-control
        # Files: phones (MTP) and cameras, iPhones, shared folders of
        # Windows, NAS and NFS; files over Bluetooth (Settings).
        gvfs-mtp
        gvfs-gphoto2
        gvfs-afc
        gvfs-smb
        gvfs-nfs
        bluez-obex
        # OpenVPN connections in Settings (WireGuard is built in).
        networkmanager-openvpn
        # Opening links and files with the right application (xdg-open),
        # and which GPU draws (glxinfo, vulkaninfo).
        xdg-utils
        mesa-utils
        vulkan-tools
        # Graphics: Mesa for Intel, AMD and Nouveau (OpenGL, Vulkan, video
        # decoding); X11 applications through XWayland.
        mesa
        vulkan-intel
        vulkan-radeon
        vulkan-nouveau
        intel-media-driver
        xorg-xwayland
        # Fonts for every language (all locales are ready to use); the
        # interface itself uses Adwaita Sans, part of GNOME.
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
