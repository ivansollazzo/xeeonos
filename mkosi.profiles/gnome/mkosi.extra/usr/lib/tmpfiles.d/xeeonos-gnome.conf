# /etc starts empty on XeeonOS (see etc.conf): the login screen's own files
# (custom.conf, session scripts) are the package defaults, kept in
# /usr/share/factory/etc/gdm and linked. To change them (for example
# automatic login in custom.conf), replace the link with a copy.
L? /etc/gdm
# Shared folders (gvfs-smb): the Samba client settings, if any.
L? /etc/samba
