# Module: live (optional, `--profile=live`)
# The live ISO: the whole OS is packed into the initrd of a Unified Kernel
# Image and runs from RAM, logged in as root. It replaces the `system` module
# (no disk partitions). Later in Phase 1 it gains the installer.

[Output]
Format=uki

[Content]
Autologin=yes
# systemd.firstboot=no: no interactive first-boot questions in the live system
# (the XeeonOS setup assistant replaces them on installed systems).
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.firstboot=no
