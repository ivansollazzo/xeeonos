# Module: plasma (optional, `--profile=plasma`)
# The KDE Plasma desktop, minimal: the Plasma Wayland session, its login
# screen (SDDM, itself on Wayland), network, sound, Bluetooth and power
# settings, and three applications: Konsole, Dolphin and Spectacle. Other
# applications come later as .xapp bundles or from Flatpak. Removing this
# module (or replacing it with another desktop) leaves the rest untouched.

[Content]
Packages=
        # The desktop and the login screen.
        plasma-desktop
        sddm
        sddm-kcm
        kwallet-pam
        xdg-desktop-portal-kde
        # Settings modules: network, sound, Bluetooth, screens, power.
        plasma-nm
        plasma-pa
        bluedevil
        kscreen
        powerdevil
        power-profiles-daemon
        kinfocenter
        # GTK applications look like the rest of the desktop.
        breeze-gtk
        kde-gtk-config
        # Applications: terminal, files, screenshots.
        konsole
        dolphin
        spectacle
        # Sound (PipeWire) and Bluetooth.
        pipewire
        pipewire-pulse
        pipewire-alsa
        pipewire-jack
        wireplumber
        bluez
        # Graphics: Mesa for Intel, AMD and Nouveau (OpenGL, Vulkan, video
        # decoding); X11 applications through XWayland.
        mesa
        vulkan-intel
        vulkan-radeon
        vulkan-nouveau
        intel-media-driver
        xorg-xwayland
        # Fonts for every language (all locales are ready to use).
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
        xdg-user-dirs
