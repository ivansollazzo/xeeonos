# Module: plasma (optional, `--profile=plasma`)
# The KDE Plasma desktop, minimal: the Plasma Wayland session, its login
# screen (SDDM, itself on Wayland), network, Bluetooth and power
# settings, and the applications that must be part of the system: Konsole,
# Dolphin, Spectacle, System Monitor and Ark. Other
# applications come later as .xapp bundles or from Flatpak. Removing this
# module (or replacing it with another desktop) leaves the rest untouched.

[Content]
Packages=
        # The desktop and the login screen.
        plasma-desktop
        sddm
        sddm-kcm
        kwallet-pam
        xdg-desktop-portal-kde
        # Settings modules: network, Bluetooth, screens, power. (Sound: with
        # the module audio, see mkosi.conf.d/audio.conf.)
        plasma-nm
        bluedevil
        kscreen
        powerdevil
        power-profiles-daemon
        kinfocenter
        # GTK applications look like the rest of the desktop.
        breeze-gtk
        kde-gtk-config
        # Applications: terminal, files, screenshots, processes and resources,
        # archives (also Dolphin's "Extract here").
        konsole
        dolphin
        spectacle
        plasma-systemmonitor
        ark
        # Graphics: Mesa for Intel, AMD and Nouveau (OpenGL, Vulkan, video
        # decoding); X11 applications through XWayland.
        mesa
        vulkan-intel
        vulkan-radeon
        vulkan-nouveau
        intel-media-driver
        xorg-xwayland
        # Fonts for every language (all locales are ready to use).
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
        xdg-user-dirs
