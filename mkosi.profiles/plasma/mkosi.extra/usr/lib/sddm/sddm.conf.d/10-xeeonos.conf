# The XeeonOS login screen (SDDM), on Wayland like the desktop: KWin draws
# it, so no X server is needed. /etc/sddm.conf.d/ can override this file.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
# --locale1: the keyboard layout chosen at setup (systemd-localed).
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
SessionDir=/usr/share/wayland-sessions

[Theme]
Current=breeze
