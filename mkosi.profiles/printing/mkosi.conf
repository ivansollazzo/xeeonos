# Module: printing (optional, `--profile=printing`)
# Printers, for every desktop: CUPS with its filters (driverless printing:
# IPP Everywhere, AirPrint), and Avahi with nss-mdns to find the printers of
# the local network. The printers page comes from the desktop module
# (Plasma: print-manager).

[Content]
Packages=
        cups
        cups-filters
        avahi
        nss-mdns
