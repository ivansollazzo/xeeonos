# Module: xapp (optional, `--profile=xapp`), experimental
# .xapp applications (docs/xapp.md): each one a whole container (its image,
# a manifest, an icon) in /var/lib/xapps (each user's ~/Applications). The
# system's monitor (xeeonos-xapps.path, `xctl app sync`) puts it in the menu;
# each user's monitor (user unit xeeonos-xapps.path, `xctl app sync --user`)
# makes its distrobox container. podman and distrobox come from the core
# module tools.
[Match]
Profiles=xapp

[Content]
Packages=
        # update-desktop-database: which application opens which files.
        desktop-file-utils
