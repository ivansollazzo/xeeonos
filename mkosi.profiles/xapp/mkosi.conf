# Module: xapp (optional, `--profile=xapp`), experimental
# .xapp applications (docs/xapp.md): directories in /var/lib/xapps (each
# user's ~/Applications), put in the menu by a monitor (xeeonos-xapps.path,
# `xctl app sync`). Applications with Runtime=distrobox use distrobox from
# the core module tools.
[Match]
Profiles=xapp

[Content]
Packages=
        # update-desktop-database: which application opens which files.
        desktop-file-utils
