# .xapp applications (docs/xapp.md). Administrators (group wheel) install
# them without sudo: the directory belongs to the group, which keeps
# (setgid, default ACL) its write rights on everything copied in.
d /var/lib/xapps 2775 root wheel -
a+ /var/lib/xapps - - - - group:wheel:rwx,default:group:wheel:rwx,default:other:r-x
d /var/lib/xeeonos/xapps/share/applications 0755 root root -
