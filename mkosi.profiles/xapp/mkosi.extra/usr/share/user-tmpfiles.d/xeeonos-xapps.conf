# Every user sees the applications (/var/lib/xapps) as ~/Applications: made
# by the user's own systemd-tmpfiles at each login, so it is there for users
# created in any way (xctl setup, Plasma's settings, useradd) and for users
# that existed before the module. Only if nothing is there yet.
L %h/Applications - - - - /var/lib/xapps
