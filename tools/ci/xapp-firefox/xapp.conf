# Firefox from Arch Linux, as an .xapp (docs/xapp.md).
Name=Firefox
Id=org.mozilla.firefox
Exec=/usr/bin/firefox %u
Icon=icon.png
Comment=Web browser
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
# For tools/mkxapp.sh only: the icon, and the package whose version is the
# application's.
IconFrom=/usr/lib/firefox/browser/chrome/icons/default/default128.png
VersionFrom=firefox
