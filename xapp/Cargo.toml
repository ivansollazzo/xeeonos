# xapp, the XeeonOS application tool: runs, installs and builds .xapp
# applications (docs/xapp.md). One program, made of several crates (crates/),
# each with its own job, like xctl:
#
#   xapp-core         shared pieces: errors, running programs, paths, dialogs,
#                     versions, dates, small file helpers
#   xapp-format       the .xapp file: manifest and container (image + trailer)
#   xapp-trust        keys, signatures, trusted authors, pinning, revocation
#   xapp-permissions  what an application may do, and what the user decided
#   xapp-sandbox      running an application: image mount, bubblewrap,
#                     seccomp, D-Bus filter, graphics from the system
#   xapp-desktop      ~/Applications: registration in the menu, file types,
#                     the monitor (xapp sync)
#   xapp-build        making a .xapp from a recipe (pacman in a container)
#   xapp              the program: picks the command
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Few, well-known crates. Cargo.lock pins their exact versions and checksums,
# and the image build uses `--locked`, so nothing changes behind our back.
[workspace.dependencies]
# Manifests and recipes are JSON.
serde_json = "1"
# SHA-256: the hash of the application image.
sha2 = "0.10"
# Ed25519: the author's signature of the manifest.
ed25519-dalek = "2"
xapp-core = { path = "crates/xapp-core" }
xapp-format = { path = "crates/xapp-format" }
xapp-trust = { path = "crates/xapp-trust" }
xapp-permissions = { path = "crates/xapp-permissions" }
xapp-sandbox = { path = "crates/xapp-sandbox" }
xapp-desktop = { path = "crates/xapp-desktop" }
xapp-build = { path = "crates/xapp-build" }

[profile.release]
# Small, fast binary: optimize, strip symbols, link-time optimization.
opt-level = 3
lto = true
strip = true
